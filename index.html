<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LiderBCI</title>
<!--STANDALONE:START-->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LiderBCI">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef2f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1320" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!--STANDALONE:END-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Concepto: el total acumulado va arriba, dentro de una tarjeta azul que imita la tarjeta física
   (chip dorado, cuatro colores); debajo el botón para registrar y el listado numerado de compras.
   Azul de la tarjeta como acento, amarillo solo en el chip, grises fríos para el resto. */
:root {
  --bg: #eef2f8;
  --surface: #ffffff;
  --ink: #101b33;
  --muted: #56627a;
  --line: #d6ddea;
  --track: #e3e9f3;
  --accent: #0b4fdc;
  --accent-bg: #e3ecff;
  --on-accent: #ffffff;
  --over: #b42318;
  --over-bg: #fdecea;
  --card-a: #2172ff;
  --card-b: #062f9e;
  --card-shade: rgba(3, 26, 110, 0.42);
  --on-card: #ffffff;
  --on-card-muted: rgba(255, 255, 255, 0.8);
  --gold: #ffc21f;
  --gold-line: #a86a00;
  --dot-1: #6aa5ff;
  --dot-2: #22b35a;
  --dot-3: #f0473d;
  --dot-4: #ffc21f;
  --scrim: rgba(8, 14, 28, 0.5);
  --font-display: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1320;
    --surface: #161f31;
    --ink: #e8edf7;
    --muted: #9aa6bd;
    --line: #283349;
    --track: #222d42;
    --accent: #7dacff;
    --accent-bg: #1b2c52;
    --on-accent: #06163d;
    --over: #ff9b92;
    --over-bg: #3b1f1d;
    --card-a: #1c5fe6;
    --card-b: #06257d;
    --card-shade: rgba(2, 14, 66, 0.5);
    --on-card: #ffffff;
    --on-card-muted: rgba(255, 255, 255, 0.8);
    --gold: #ffc21f;
    --gold-line: #a86a00;
    --dot-1: #6aa5ff;
    --dot-2: #22b35a;
    --dot-3: #f0473d;
    --dot-4: #ffc21f;
    --scrim: rgba(0, 0, 0, 0.62);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1320;
  --surface: #161f31;
  --ink: #e8edf7;
  --muted: #9aa6bd;
  --line: #283349;
  --track: #222d42;
  --accent: #7dacff;
  --accent-bg: #1b2c52;
  --on-accent: #06163d;
  --over: #ff9b92;
  --over-bg: #3b1f1d;
  --card-a: #1c5fe6;
  --card-b: #06257d;
  --card-shade: rgba(2, 14, 66, 0.5);
  --on-card: #ffffff;
  --on-card-muted: rgba(255, 255, 255, 0.8);
  --gold: #ffc21f;
  --gold-line: #a86a00;
  --dot-1: #6aa5ff;
  --dot-2: #22b35a;
  --dot-3: #f0473d;
  --dot-4: #ffc21f;
  --scrim: rgba(0, 0, 0, 0.62);
  color-scheme: dark;
}
html.lock { overflow: hidden; }
[hidden]:not([hidden=until-found i]) { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
  padding-inline: 16px;
  -webkit-text-size-adjust: 100%;
}
.app { max-width: 480px; margin: 0 auto; padding-block: 20px 40px; display: flex; flex-direction: column; gap: 18px; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
h1, h2 { margin: 0; font-family: var(--font-display); letter-spacing: -0.01em; text-wrap: balance; }
.eyebrow { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.muted { color: var(--muted); margin: 0; }
svg { display: block; }

/* Encabezado */
.top { display: flex; align-items: center; gap: 12px; }
.mark { width: 44px; height: 44px; border-radius: 14px; background: var(--accent-bg); color: var(--accent); display: grid; place-items: center; flex: none; }
.top h1 { font-size: 28px; font-weight: 700; line-height: 1.1; }

/* Botones */
.btn {
  min-height: 52px; padding: 0 20px; border-radius: 14px; border: 1.5px solid transparent;
  font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:active { opacity: 0.85; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--ink); }
.btn.danger { background: transparent; border-color: var(--over); color: var(--over); }
.btn.danger.armed, .btn.danger.solid { background: var(--over); color: var(--bg); }
.btn.tonal { background: var(--accent-bg); color: var(--ink); }
.btn.small { min-height: 44px; padding: 0 14px; font-size: 15px; }
.btn.block { width: 100%; }
.btn.big { min-height: 58px; font-size: 17px; border-radius: 16px; }

/* Total acumulado: la tarjeta */
.hero {
  position: relative; overflow: hidden; border-radius: 24px; padding: 20px 20px 18px;
  background: linear-gradient(135deg, var(--card-a), var(--card-b)); color: var(--on-card);
  display: flex; flex-direction: column; gap: 10px;
}
.hero::before, .hero::after { content: ""; position: absolute; border-radius: 50%; background: var(--card-shade); pointer-events: none; }
.hero::before { width: 300px; height: 300px; right: -90px; bottom: -170px; }
.hero::after { width: 190px; height: 190px; right: -40px; bottom: -120px; }
.hero > * { position: relative; z-index: 1; }
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.hero .eyebrow { color: var(--on-card-muted); }
.chipmark { width: 46px; height: 36px; flex: none; }
.chipmark rect { fill: var(--gold); }
.chipmark path { stroke: var(--gold-line); stroke-width: 2; fill: none; }
.total {
  font-family: var(--font-display); font-weight: 700; line-height: 1; letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums; overflow-wrap: anywhere; margin: 6px 0 2px;
}
.total.xl { font-size: min(60px, 15.5vw); }
.total.lg { font-size: min(50px, 13vw); }
.total.md { font-size: min(42px, 11vw); }
.total.sm { font-size: min(34px, 9vw); }
.hero-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.hero-foot p { margin: 0; font-size: 15px; font-weight: 500; color: var(--on-card-muted); min-width: 0; }
.dots { display: flex; flex: none; }
.dots i { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--on-card); margin-left: -7px; }
.dots i:first-child { margin-left: 0; background: var(--dot-1); }
.dots i:nth-child(2) { background: var(--dot-2); }
.dots i:nth-child(3) { background: var(--dot-3); }
.dots i:nth-child(4) { background: var(--dot-4); }

/* Listado */
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.sec-head h2 { font-size: 22px; }
.sec-head .btn { flex: none; white-space: nowrap; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.row, .linkrow {
  width: 100%; text-align: left; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px 10px 10px; min-height: 60px;
}
.row:active, .linkrow:active { background: var(--track); }
.linkrow { padding: 10px 12px 10px 10px; }
.linkrow > svg { color: var(--muted); }
.mark.sm { width: 40px; height: 40px; border-radius: 12px; }
.num {
  min-width: 36px; height: 36px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: var(--accent-bg); color: var(--accent);
  display: grid; place-items: center; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums;
}
.info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.store { font-weight: 600; overflow-wrap: anywhere; }
.meta { font-size: 14px; color: var(--muted); }
.amt { font-family: var(--font-display); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.empty { margin: 0; padding: 16px; border: 1.5px dashed var(--line); border-radius: 16px; color: var(--muted); }

/* Nuevo periodo */
.period { border-top: 1px solid var(--line); padding-top: 18px; display: flex; flex-direction: column; gap: 10px; }
.period h2 { font-size: 20px; }
.foot { margin: 0; font-size: 13px; color: var(--muted); text-align: center; }

/* Respaldo */
.backup { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 4px 16px; }
.backup summary { min-height: 48px; display: flex; align-items: center; font-weight: 600; cursor: pointer; }
.backup[open] { padding-bottom: 16px; }
.backup > *:not(summary) { margin-top: 10px; }
.backup textarea { width: 100%; box-sizing: border-box; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); padding: 10px 12px; font-size: 14px; font-family: ui-monospace, Menlo, monospace; resize: vertical; }
.bk-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.bk-actions .btn { flex: 1; min-width: 0; min-height: 48px; }

/* Hoja de registro */
.sheet { position: fixed; inset: 0; z-index: 10; display: flex; align-items: flex-end; justify-content: center; }
.backdrop { position: absolute; inset: 0; background: var(--scrim); }
.panel {
  position: relative; width: 100%; max-width: 480px; max-height: 94%; overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); border-radius: 24px 24px 0 0; box-sizing: border-box;
  padding: 22px 16px calc(22px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 16px; animation: rise 0.2s ease-out;
}
.panel:focus { outline: none; }
.panel h2 { font-size: 24px; }
.panel .sub { margin: -8px 0 0; color: var(--muted); font-size: 15px; }
.panel .sub strong { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.field { display: flex; flex-direction: column; gap: 6px; border: 0; padding: 0; margin: 0; min-width: 0; }
.field > span { font-size: 14px; font-weight: 600; padding: 0; }
.field input[type="date"], .field input[type="text"] {
  display: block; width: 100%; min-width: 0; min-height: 52px; box-sizing: border-box;
  -webkit-appearance: none; appearance: none; font-size: 16px;
  border: 1.5px solid var(--line); border-radius: 12px; padding: 0 14px; background: var(--bg); color: var(--ink);
}
.price-wrap { position: relative; }
.price-wrap b { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 600; pointer-events: none; }
.price-wrap input { padding-left: 30px !important; font-variant-numeric: tabular-nums; }
.err { margin: 0; padding: 10px 12px; border-radius: 12px; background: var(--over-bg); color: var(--over); font-weight: 600; font-size: 15px; }
.stack { display: flex; flex-direction: column; gap: 10px; }

/* Hoja del widget */
.fine { font-size: 14px; }
.note { margin: 0; padding: 10px 12px; border-radius: 12px; background: var(--accent-bg); color: var(--ink); font-size: 14px; overflow-wrap: anywhere; }
.note strong { font-weight: 600; }
.note .btn { margin-top: 8px; }
.fold { border: 1px solid var(--line); border-radius: 16px; padding: 0 14px; }
.fold summary { min-height: 48px; display: flex; align-items: center; font-weight: 600; cursor: pointer; }
.fold[open] { padding-bottom: 14px; }
.guide { margin: 0; padding: 0; list-style: none; counter-reset: paso; display: flex; flex-direction: column; gap: 12px; }
.guide li { counter-increment: paso; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; font-size: 15px; }
.guide li::before { content: counter(paso); width: 28px; height: 28px; border-radius: 999px; background: var(--accent-bg); color: var(--ink); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.guide li > div { min-width: 0; overflow-wrap: anywhere; }
.guide strong { font-weight: 600; }
.guide .btn { margin-top: 8px; }
.mono { font-family: ui-monospace, Menlo, monospace; font-size: 14px; background: var(--track); padding: 1px 6px; border-radius: 6px; overflow-wrap: anywhere; }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .panel { animation: none; } }

.toast {
  position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: 448px; margin: 0 auto; z-index: 20;
  background: var(--ink); color: var(--bg); padding: 6px 16px; min-height: 48px; box-sizing: border-box; border-radius: 14px; font-size: 15px;
  display: flex; align-items: center; justify-content: center; gap: 14px; text-align: center;
}
.toast.top { bottom: auto; top: calc(12px + env(safe-area-inset-top, 0px)); }
.toast button { background: none; border: 0; padding: 0 4px; min-height: 44px; color: inherit; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; flex: none; }
</style>
</head>
<body>

<main class="app" id="app"></main>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  'use strict';

  var MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  var LS_KEY = 'liderbci-compras';
  var LS_ORDER = 'liderbci-orden';
  var LS_STORES = 'liderbci-comercios';
  var COL = 'compras';
  var DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  var MAX_AMOUNT = 999999999;
  var LS_PREFS = 'liderbci-preferencias';
  var API = 'https://api.github.com/repos/';
  var BOX = 'fan-avisos';              // por omisión, el mismo repositorio privado que usan FAN y Master
  var REPO_RE = /^[A-Za-z0-9][A-Za-z0-9-]{0,38}\/[A-Za-z0-9._-]{1,100}$/;
  var OWNER = /\.github\.io$/i.test(location.hostname) ? location.hostname.split('.')[0] : '';
  var WIDGET_TITLE = 'LiderBCI · widget';   // hito del repositorio privado donde se publica el estado para el widget
  // Script del widget para la app Scriptable (el mismo de widget/liderbci-widget.js); al copiarlo se completa con el repositorio y el token
  var WIDGET_CODE = /*WIDGET:START*/"// Variables used by Scriptable.\n// These must be at the very top of the file. Do not edit.\n// icon-color: blue; icon-glyph: credit-card;\n\n// LiderBCI · widget para la pantalla de inicio del iPhone (app Scriptable)\n//\n// Muestra el total acumulado del periodo y las tres últimas compras. Lee lo que LiderBCI publica en tu\n// repositorio privado de GitHub cada vez que anotas, corriges o borras una compra. No copies este archivo a\n// mano: usa el botón «Copiar el script del widget» de LiderBCI, que completa las dos líneas siguientes con tu\n// repositorio y tu token.\nconst REPO = '__REPO__';\nconst TOKEN = '__TOKEN__';\n\nconst API = 'https://api.github.com/repos/' + REPO;\nconst MS_TITLE = 'LiderBCI · widget';\nconst MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];\n\n/* ---------- Formatos ---------- */\nfunction pad(n) { return (n < 10 ? '0' : '') + n; }\nfunction dayKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }\nfunction dots(n) { return String(Math.round(Math.abs(n))).replace(/\\B(?=(\\d{3})+(?!\\d))/g, '.'); }\nfunction money(n) { return (n < 0 ? '−' : '') + '$' + dots(n); }\nfunction hm(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }\nfunction dayLabel(k) {\n  const t = new Date(), y = new Date(t.getFullYear(), t.getMonth(), t.getDate() - 1);\n  if (k === dayKey(t)) return 'hoy';\n  if (k === dayKey(y)) return 'ayer';\n  const p = k.split('-');\n  return (+p[2]) + ' ' + MES[+p[1] - 1];\n}\n\n/* ---------- Datos ---------- */\nasync function gh(path) {\n  const r = new Request(API + path);\n  r.headers = { Authorization: 'Bearer ' + TOKEN, Accept: 'application/vnd.github+json' };\n  r.timeoutInterval = 20;\n  const data = await r.loadJSON();\n  const code = r.response && r.response.statusCode;\n  if (code && code >= 400) { const e = new Error('GitHub ' + code); e.status = code; throw e; }\n  return data;\n}\nfunction cachePath() { const fm = FileManager.local(); return fm.joinPath(fm.documentsDirectory(), 'liderbci-widget.json'); }\nfunction readCache() {\n  try { const fm = FileManager.local(), p = cachePath(); return fm.fileExists(p) ? JSON.parse(fm.readString(p)) : null; } catch (e) { return null; }\n}\nfunction writeCache(res) { try { FileManager.local().writeString(cachePath(), JSON.stringify(res)); } catch (e) {} }\n\n// El total y las últimas compras, tal como LiderBCI los publicó la última vez que cambió algo\nasync function load() {\n  const list = await gh('/milestones?state=all&per_page=100');\n  const ms = (Array.isArray(list) ? list : []).filter(function (x) { return x && x.title === MS_TITLE; })[0];\n  let st = null;\n  try { st = ms && ms.description ? JSON.parse(ms.description) : null; } catch (e) { st = null; }\n  if (!st || st.app !== 'liderbci') return { msg: 'Abre LiderBCI y activa el widget en «Widget en la pantalla de inicio».' };\n  const buys = (Array.isArray(st.ult) ? st.ult : [])\n    .filter(function (b) { return b && /^\\d{4}-\\d{2}-\\d{2}$/.test(String(b.d)) && b.m > 0; }).slice(0, 3)\n    .map(function (b) { return { d: String(b.d), c: String(b.c || 'Compra'), m: +b.m }; });\n  return { total: typeof st.total === 'number' ? st.total : 0, n: +st.n > 0 ? Math.round(+st.n) : 0, buys: buys, at: Date.now() };\n}\n\n/* ---------- Dibujo ---------- */\nconst WHITE = new Color('#ffffff'), GOLD = new Color('#ffc21f');\nfunction label(stack, str, size, color, opacity, bold) {\n  const t = stack.addText(str);\n  t.font = bold ? Font.boldSystemFont(size) : Font.systemFont(size);\n  t.textColor = color || WHITE;\n  if (opacity) t.textOpacity = opacity;\n  t.lineLimit = 1;\n  return t;\n}\nfunction build(res, family) {\n  const w = new ListWidget();\n  const lock = String(family || '').indexOf('accessory') === 0;\n  const small = family === 'small';\n  if (lock) {\n    // Pantalla bloqueada: total acumulado y última compra\n    label(w, 'LiderBCI ' + (res.msg ? '' :       list = await ghJson('GET', '/milestones?state=all&per_page=100', null, repo, token);
    } catch (e) {
      if (sheet) sheet.testing = false;
      if (btn) { btn.disabled = false; btn.textContent = 'Probar y conectar'; }
      setErr(errMsg(errCode(e)));
      return;
    }
    var found = (Array.isArray(list) ? list : []).filter(function (x) { return x && x.title === WIDGET_TITLE; })[0];
    prefs.repo = repo; prefs.token = token; prefs.widget = false; prefs.wm = found ? found.number : 0; prefs.wSig = ''; prefs.wAt = 0; widgetErr = '';
    saveBox();
    openSheet('widget');   // ahora muestra los pasos para instalar el widget
    render();
    toast('Repositorio conectado. Ahora copia el script del widget.', null, null, 5000);
  }

  function toast(msg, actLabel, actFn, ms) {
    toastEl.textContent = '';
    var s = document.createElement('span');
    s.textContent = msg;
    toastEl.appendChild(s);
    if (actLabel) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = actLabel;
      b.addEventListener('click', function () { toastEl.hidden = true; clearTimeout(toast.t); actFn(); });
      toastEl.appendChild(b);
    }
    toastEl.classList.toggle('top', !!sheet);
    toastEl.hidden = false;
    clearTimeout(toast.t);
    toast.t = setTimeout(function () { toastEl.hidden = true; }, ms || 3200);
  }

  function copyText(text, okMsg) {
    function legacy() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.opacity = '0'; ta.style.left = '0'; ta.style.top = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      toast(ok ? okMsg : 'No se pudo copiar en este dispositivo');
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast(okMsg); }, legacy);
      else legacy();
    } catch (e) { legacy(); }
  }

  function listText() {
    var n = items.length;
    var lines = ['LiderBCI · ' + n + ' ' + plural(n, 'compra', 'compras') + ' · Total ' + money(total())];
    items.forEach(function (p, i) { lines.push((i + 1) + '. ' + fmt(p.date) + ' · ' + p.store + ' · ' + money(p.amount)); });
    return lines.join('\n');
  }

  /* ---------- Vistas ---------- */
  function header() {

  function hero() {
    var n = items.length, txt = money(total());

    var foot;
    if (loading) foot = 'Buscando tus registros…';
    else if (!n) foot = 'Sin compras en este periodo';
    else {
      var a = items[0].date, b = items[n - 1].date;
      foot = n + ' ' + plural(n, 'compra', 'compras') + ' · ' + (a === b ? fmt(a) : range(a, b));

      '<div class="total ' + size + '">' + txt + '</div>' +

      '</section>';

  function listBlock() {
    var n = items.length;
    var h = '<section aria-label="Compras"><div class="sec-head"><h2>Compras</h2>';
    if (n > 1) h += '<button class="btn ghost small" data-act="order" aria-label="Cambiar el orden del listado">' + I_SORT + (order === 'desc' ? 'Recientes primero' : 'Antiguas primero') + '</button>';
    h += '</div>';
    if (!n) {
      h += '<p class="empty">Aún no hay compras. Toca «Registrar compra» para anotar la primera, con su fecha, comercio y monto.</p>';
    } else {
      var rows = items.map(function (p, i) { return { p: p, n: i + 1 }; });
      if (order === 'desc') rows.reverse();

      rows.forEach(function (r) {
        var p = r.p;

          '<span class="num">' + r.n + '</span>' +

  function periodBlock() {
    var n = items.length;
    return '<section class="period" aria-label="Nuevo periodo de facturación"><h2>Nuevo periodo</h2>' +
      '<p class="muted">Cuando cierre la facturación de la tarjeta, limpia los registros para empezar el siguiente periodo desde cero.</p>' +
      '<button class="btn danger block" data-act="clear"' + (n ? '' : ' disabled') + '>Limpiar registros</button></section>';
  }

  function backupBlock() {
    if (window.claude) return '';
    return '<details class="backup"><summary>Respaldo de datos</summary>' +
      '<p class="muted">Las compras se guardan solo en este dispositivo. Copia un respaldo para guardarlo en Notas o llevarlo a otro equipo.</p>' +
      '<textarea id="bk-text" rows="4" spellcheck="false" aria-label="Texto del respaldo"></textarea>' +
      '<div class="bk-actions"><button class="btn ghost" data-act="bk-copy">Copiar respaldo</button><button class="btn ghost" data-act="bk-restore">Restaurar desde el texto</button></div></details>';

  function widgetBlock() {
    if (!canSync) return '';
    return '<button class="linkrow" data-act="widget"><span class="mark sm">' + I_WIDGET + '</span>' +
      '<span class="info"><span class="store">Widget en la pantalla de inicio</span><span class="meta" id="w-line">' + esc(widgetLine()) + '</span></span>' + I_CHEV + '</button>';

  function render() {
    var h = header() + hero();
    if (!loading) {
      h += '<button class="btn primary block big" data-act="add">' + I_PLUS + 'Registrar compra</button>' +
        listBlock() + periodBlock() + widgetBlock() + backupBlock();

  /* ---------- Hoja del widget ---------- */
  function sheetWidget() {
    var head = '<h2 id="sheet-title">Widget en la pantalla de inicio</h2>';
    if (prefs.repo) {
      return '<div class="panel" id="sheet-form" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">' + head +
        '<p class="sub">Muestra el total acumulado y las tres últimas compras. Se hace con la app gratuita Scriptable, porque una app web no puede crear widgets por sí sola.</p>' +
        '<ol class="guide">' +
        '<li><div>Instala <strong>Scriptable</strong> desde el App Store.</div></li>' +

        '<li><div>Abre Scriptable, toca <strong>+</strong> y pega el script. Toca el título de arriba y nómbralo <strong>LiderBCI</strong>. Ejecútalo con <strong>▶</strong>: debe mostrar el total acumulado.</div></li>' +
        '<li><div>En la pantalla de inicio, mantén presionado un espacio vacío, toca <strong>Editar</strong> y <strong>Agregar widget</strong>. Busca <strong>Scriptable</strong> y elige el tamaño mediano.</div></li>' +

        '<p class="note" id="w-status">' + widgetNote() + '</p>' +
        '<div class="stack"><button type="button" class="btn danger block" data-act="disconnect">Desconectar el repositorio</button>' +
        '<button type="button" class="btn ghost block" data-act="cancel">Cerrar</button></div></div>';
    }
    var known = knownBox(), repoV = known ? known.repo : OWNER ? OWNER + '/' + BOX : '';
    return '<form class="panel" id="sheet-form" novalidate role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">' + head +
      '<p class="sub">Muestra el total acumulado y las tres últimas compras sin abrir la app. Para que el widget pueda leerlos, LiderBCI los publica en un repositorio privado de tu GitHub.</p>' +
      (known ? '<p class="note"><strong>Encontré el buzón de ' + known.app + ' en este dispositivo</strong> y completé los datos. Toca «Probar y conectar».</p>'
             : '<p class="note"><strong>Si ya usas FAN o Master, sirve el mismo buzón.</strong> Abre FAN y entra a «Buzón y atajo». Toca «Automatización en Atajos» para desplegarla y, en el paso 5, toca «Copiar autorización». Pega ese texto aquí como token.</p>') +
      '<label class="field"><span>Repositorio privado</span><input type="text" id="f-repo" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="next" placeholder="' + (OWNER || 'tu-usuario') + '/' + BOX + '" value="' + esc(repoV) + '"></label>' +
      '<label class="field"><span>Token de acceso</span><input type="text" id="f-token" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="go" placeholder="github_pat_…" value="' + (known ? esc(known.token) : '') + '"></label>' +
      '<details class="fold"><summary>No tengo ese repositorio</summary><ol class="guide">' +
      '<li><div>En GitHub, crea un repositorio <strong>privado</strong>, por ejemplo <span class="mono">' + BOX + '</span>.</div></li>' +
      '<li><div>Crea un token en <strong>Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate new token</strong>.</div></li>' +
      '<li><div>En <strong>Repository access</strong> elige <strong>Only select repositories</strong> y marca ese repositorio. En <strong>Permissions</strong>, da a <strong>Issues</strong> el acceso <strong>Read and write</strong>.</div></li>' +
      '<li><div>Toca <strong>Generate token</strong>, copia el token y pégalo aquí.</div></li>' +
      '</ol></details>' +
      '<p class="note">El token queda guardado solo en este dispositivo y no entra en los respaldos. Sirve únicamente para los Issues de ese repositorio.</p>' +
      '<p class="err" id="f-err" role="alert" hidden></p>' +
      '<div class="stack"><button type="submit" class="btn primary block" id="f-connect">Probar y conectar</button>' +
      '<button type="button" class="btn ghost block" data-act="cancel">Cancelar</button></div></form>';
  }

  /* ---------- Hoja de registro ---------- */
  function renderSheet() {
    var s = sheet, today = todayKey(), h = '<div class="backdrop" data-act="cancel"></div>';
    if (s.mode === 'widget') { sheetEl.innerHTML = h + sheetWidget(); return; }
    if (s.mode === 'clear') {
      var n = items.length;
      h += '<div class="panel" id="sheet-form" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">' +
        '<h2 id="sheet-title">Limpiar registros</h2>' +
        '<p class="sub">Se ' + plural(n, 'borrará la compra', 'borrarán las <strong>' + n + '</strong> compras') + ' de este periodo, por un total de <strong>' + money(total()) + '</strong>. El listado queda en cero para el siguiente periodo de facturación.</p>' +
        '<div class="stack"><button type="button" class="btn danger solid block" data-act="clear-yes">' + (n === 1 ? 'Borrar la compra' : 'Borrar las ' + n + ' compras') + '</button>' +
        '<button type="button" class="btn ghost block" data-act="copy-list">Copiar el listado antes de borrar</button>' +
        '<button type="button" class="btn ghost block" data-act="cancel">Cancelar</button></div></div>';
      sheetEl.innerHTML = h;
      return;
    }
    var p = s.id ? find(s.id) : null;
    var dateV = p ? p.date : (s.keepDate || today);
    var opts = storeOptions().map(function (x) { return '<option value="' + esc(x) + '"></option>'; }).join('');
    h += '<form class="panel" id="sheet-form" novalidate role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">' +
      '<h2 id="sheet-title">' + (p ? 'Editar compra' : 'Registrar compra') + '</h2>' +
      (p ? '<p class="sub">Compra N.º ' + numOf(p.id) + ' de este periodo.</p>' : '') +
      '<label class="field"><span>Fecha</span><input type="date" id="f-date" value="' + dateV + '" max="' + today + '" required></label>' +
      '<label class="field"><span>Comercio</span><input type="text" id="f-store" list="f-stores" maxlength="60" autocomplete="off" autocapitalize="words" enterkeyhint="next" placeholder="Ej. Supermercado" value="' + (p ? esc(p.store) : '') + '"></label>' +
      '<datalist id="f-stores">' + opts + '</datalist>' +
      '<label class="field"><span>Monto</span><div class="price-wrap"><b>$</b><input type="text" id="f-amount" inputmode="numeric" autocomplete="off" enterkeyhint="done" placeholder="Ej. 24.990" value="' + (p ? dots(p.amount) : '') + '"></div></label>' +
      '<p class="err" id="f-err" role="alert" hidden></p>' +
      '<div class="stack"><button type="submit" class="btn primary block">' + (p ? 'Guardar cambios' : 'Guardar compra') + '</button>' +
      (p ? '<button type="button" class="btn danger block" data-act="delete">Eliminar compra</button>'
         : '<button type="button" class="btn ghost block" data-act="save-more">Guardar y agregar otra</button>') +
      '<button type="button" class="btn ghost block" data-act="cancel">Cancelar</button></div></form>';
    sheetEl.innerHTML = h;
  }

  // Mantiene la hoja dentro del área visible cuando aparece el teclado del teléfono
  function fitSheet() {
    var vv = window.visualViewport;
    if (!vv || sheetEl.hidden) return;
    sheetEl.style.top = vv.offsetTop + 'px';
    sheetEl.style.bottom = 'auto';
    sheetEl.style.height = vv.height + 'px';
  }
  function openSheet(m, id) {
    if (m === 'edit' && !find(id)) return;
    if (m === 'clear' && !items.length) return;
    if (m === 'widget' && !canSync) return;
    sheet = { mode: m, id: id || null, del: false, keepDate: null, testing: false };
    renderSheet();
    sheetEl.hidden = false;
    document.documentElement.classList.add('lock');
    toastEl.classList.add('top');
    fitSheet();
    var target = m === 'add' ? document.getElementById('f-store') : document.getElementById('sheet-form');
    if (target) target.focus();
  }
  function closeSheet() {
    sheet = null; sheetEl.hidden = true; sheetEl.innerHTML = '';
    sheetEl.style.top = ''; sheetEl.style.bottom = ''; sheetEl.style.height = '';
    document.documentElement.classList.remove('lock');
  }
  function setErr(msg) {
    var e = document.getElementById('f-err');
    if (!e) return;
    e.textContent = msg; e.hidden = !msg;
  }
  function val(id) { var el = document.getElementById(id); return el ? el.value : ''; }

  async function saveForm(more) {
    if (!sheet || busy || (sheet.mode !== 'add' && sheet.mode !== 'edit')) return;
    var today = todayKey();
    var date = val('f-date'), store = clean(val('f-store')), raw = val('f-amount').replace(/[.\s$]/g, '');
    if (!validDate(date)) { setErr('Indica la fecha de la compra.'); return; }
    if (date > today) { setErr('La fecha de la compra no puede ser futura.'); return; }
    if (!store) { setErr('Escribe el nombre del comercio.'); return; }
    if (!/^\d+$/.test(raw) || +raw <= 0) { setErr('Escribe el monto en pesos, por ejemplo 24990.'); return; }
    if (+raw > MAX_AMOUNT) { setErr('El monto es demasiado grande. Revisa los dígitos.'); return; }
    var p = sheet.id ? find(sheet.id) : null;
    if (sheet.mode === 'edit' && !p) { closeSheet(); return; }
    var rec = p ? { id: p.id, date: date, store: store, amount: +raw, ts: p.ts }
                : { id: genId(), date: date, store: store, amount: +raw, ts: Date.now() };
    busy = true;
    var ok = await commit([rec], []);
    busy = false;
    if (!ok) return;
    rememberStore(store);
    if (more && !p) {
      sheet = { mode: 'add', id: null, del: false, keepDate: date };
      renderSheet();
      var el = document.getElementById('f-store');
      if (el) el.focus();
      toast('Compra registrada · ' + money(rec.amount));
    } else {
      closeSheet();
      toast(p ? 'Cambios guardados' : 'Compra registrada');
    }
  }

  sheetEl.addEventListener('click', async function (ev) {
    var b = ev.target.closest('[data-act]');
    if (!b || !sheet) return;
    var a = b.getAttribute('data-act');
    if (a === 'cancel') { if (!busy && !sheet.testing) closeSheet(); return; }
    if (a === 'copy-widget') {
      copyText(WIDGET_CODE.replace('__REPO__', function () { return prefs.repo; }).replace('__TOKEN__', function () { return prefs.token; }), 'Script copiado. El widget quedó activado.');
      if (!prefs.widget) { prefs.widget = true; saveBox(); }
      widgetRefresh();
      publishWidget();
      return;
    }
    if (a === 'widget-off') {
      await widgetOff();
      closeSheet(); render();
      toast('Widget desactivado. Puedes quitarlo de la pantalla de inicio.');
      return;
    }
    if (a === 'disconnect') {
      if (!sheet.del) { sheet.del = true; b.textContent = 'Toca de nuevo para desconectar'; b.classList.add('armed'); return; }
      if (prefs.widget) await widgetOff();
      prefs.repo = ''; prefs.token = ''; prefs.wm = 0; saveBox();
      closeSheet(); render();
      toast('Repositorio desconectado. Tus compras siguen aquí.');
      return;
    }
    if (a === 'save-more') { saveForm(true); return; }
    if (a === 'copy-list') { copyText(listText(), 'Listado copiado'); return; }
    if (a === 'delete') {
      var p = sheet.id ? find(sheet.id) : null;
      if (!p) { closeSheet(); return; }
      if (!sheet.del) { sheet.del = true; b.textContent = 'Toca de nuevo para eliminar'; b.classList.add('armed'); return; }
      if (busy) return; busy = true;
      var ok = await commit([], [p.id]); busy = false;
      if (ok) { closeSheet(); toast('Compra eliminada', 'Deshacer', function () { commit([p], []); }, 6000); }
    } else if (a === 'clear-yes') {
      if (busy || !items.length) return;
      var snap = items.slice();
      busy = true; b.textContent = 'Borrando…';
      var ok2 = await commit([], snap.map(function (x) { return x.id; }));
      busy = false;
      if (ok2) {
        closeSheet();
        toast('Registros borrados. Nuevo periodo en $0.', 'Deshacer', function () { commit(snap, []); }, 9000);
      } else if (sheet) { renderSheet(); }
    }
  });

  sheetEl.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (sheet && sheet.mode === 'widget') connectWidget();
    else saveForm(false);
  });

  // El monto se muestra con separador de miles mientras se escribe
  sheetEl.addEventListener('input', function (ev) {
    var t = ev.target;
    if (!t || t.id !== 'f-amount') return;
    var d = t.value.replace(/\D/g, '').replace(/^0+/, '').slice(0, 9);
    t.value = d ? dots(+d) : '';
  });
  // En "Comercio", la tecla de avance pasa al monto en vez de guardar
  sheetEl.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter' || !ev.target || ev.target.id !== 'f-store') return;
    ev.preventDefault();
    var el = document.getElementById('f-amount');
    if (el) el.focus();
  });

  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && sheet && !busy && !sheet.testing) closeSheet(); });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fitSheet);
    window.visualViewport.addEventListener('scroll', fitSheet);
  }

  /* ---------- Acciones de la página ---------- */
  app.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-act]');
    if (!b) return;
    var a = b.getAttribute('data-act');
    if (a === 'add') openSheet('add');
    else if (a === 'edit') openSheet('edit', b.getAttribute('data-id'));
    else if (a === 'clear') openSheet('clear');
    else if (a === 'widget') openSheet('widget');
    else if (a === 'order') {
      order = order === 'desc' ? 'asc' : 'desc';
      try { localStorage.setItem(LS_ORDER, order); } catch (e) {}
      render();
    }
    else if (a === 'bk-copy') backupCopy();
    else if (a === 'bk-restore') backupRestore(b);
  });

  function backupCopy() {
    var ta = document.getElementById('bk-text');
    var json = JSON.stringify(items.map(function (p) { return { id: p.id, date: p.date, store: p.store, amount: p.amount, ts: p.ts }; }));
    ta.value = json;
    function manual() { ta.focus(); ta.select(); toast('Selecciona el texto y cópialo'); }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(json).then(function () { toast('Respaldo copiado'); }, manual);
      else manual();
    } catch (e) { manual(); }
  }

  function backupRestore(btn) {
    var ta = document.getElementById('bk-text');
    var list = [];
    try {
      var data = JSON.parse(ta.value);
      if (!Array.isArray(data)) throw new Error('formato');
      data.forEach(function (p) { var n = norm(p); if (n) list.push(n); });
    } catch (e) { toast('El texto no es un respaldo válido'); return; }
    if (!list.length) { toast('El respaldo no tiene compras válidas'); return; }
    if (items.length && !restoreArmed) {
      restoreArmed = true; btn.textContent = 'Toca de nuevo para reemplazar';
      toast('Esto reemplaza las compras de este dispositivo');
      return;
    }
    restoreArmed = false;
    items = list; sortItems(); saveLocal(); render();
    queueWidget();
    toast('Respaldo restaurado');
  }

  /* ---------- Arranque ---------- */
  function fallback() { mode = 'local'; db = null; loading = false; loadLocal(); render(); }

  async function connect() {
    try {
      if (!window.claude || !window.claude.use) return;
      db = await window.claude.use('db');
      if (!db) { fallback(); return; }
      mode = 'db';
      db.collection(COL).onSnapshot(function (snap) {
        var list = [];
        snap.docs.forEach(function (doc) {
          var n = norm(Object.assign({}, doc.data() || {}, { id: doc.id }));
          if (n) list.push(n);
        });
        items = list; sortItems(); loading = false; render();
      }, function () { fallback(); });
    } catch (e) { fallback(); }
  }

  loadPrefs();
  if (canSync) loadBox();
  if (!loading) loadLocal();
  render();
  connect();
  queueWidget();   // si algo quedó sin enviar la última vez, se envía ahora

  // Al volver a la app se reintenta lo pendiente; al salir, se envía de inmediato lo que estaba en espera
  document.addEventListener('visibilitychange', function () {
    if (!canSync || !prefs.widget) return;
    if (document.visibilityState === 'visible') { if (widgetPending()) queueWidget(); else widgetRefresh(); }
    else if (widgetTimer) { clearTimeout(widgetTimer); widgetTimer = 0; publishWidget(); }
  });
